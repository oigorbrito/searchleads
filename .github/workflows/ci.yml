name: CI

on:
  pull_request:
  push:
    branches:
      - 'work/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install pytest
      - name: Verify installed import
        run: python -c "import searchleads; print(searchleads.__name__)"
      - name: Run internal RC hygiene preflight
        run: python scripts/check_internal_rc.py
      - name: Compile package
        run: python -m compileall -q src
      - name: Run RC and recovery regression
        run: >-
          python -m pytest -q
          tests/test_release_candidate.py
          tests/test_release_hygiene.py
          tests/test_operational_readiness.py
          tests/test_operational_canonical_integration.py
          tests/test_persistence_migrations.py
          tests/test_persistence.py
          tests/test_domain_canonical_model.py
      - name: Run external governance and pilot-release regression
        run: >-
          python -m pytest -q
          tests/test_external_governance.py
          tests/test_campaign_preflight.py
          tests/test_governance_decision_io.py
          tests/test_professional_verification_io.py
          tests/test_governance_persistence.py
          tests/test_governance_preflight.py
          tests/test_governance_intake.py
          tests/test_governance_intake_cli.py
          tests/test_governance_snapshot.py
          tests/test_governance_snapshot_cli.py
          tests/test_governance_audit.py
          tests/test_governance_audit_cli.py
          tests/test_governance_evidence_bundle.py
          tests/test_governance_evidence_bundle_cli.py
          tests/test_governance_evidence_review.py
          tests/test_governance_evidence_review_cli.py
          tests/test_governance_evidence_review_status.py
          tests/test_governance_evidence_review_status_cli.py
          tests/test_governance_evidence_review_resolution.py
          tests/test_governance_evidence_review_resolution_cli.py
          tests/test_governance_effective_review_status.py
          tests/test_governance_effective_review_status_cli.py
          tests/test_governance_effective_review_audit.py
          tests/test_governance_effective_review_audit_cli.py
          tests/test_governance_effective_review_evidence_bundle.py
          tests/test_governance_effective_review_evidence_bundle_cli.py
          tests/test_governance_effective_review_verification_receipt.py
          tests/test_governance_effective_review_verification_receipt_cli.py
          tests/test_pilot_release.py
          tests/test_operational_readiness.py
      - name: Run opt-in BrasilAPI live revalidation
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-brasilapi]') && matrix.python-version == '3.12'
        run: python scripts/revalidate_brasilapi_live.py
      - name: Run offline regression
        run: python -m pytest -q
