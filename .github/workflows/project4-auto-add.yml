name: Project 4 operational memory

on:
  issues:
    types: [opened, reopened, transferred, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT4_ADD_PAT }}
      REPO_TOKEN: ${{ github.token }}
      PROJECT_OWNER: tihotm
      PROJECT_NUMBER: '4'
      CONTENT_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
    steps:
      - name: Resolve desired project status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}:${{ github.event.action }}" in
            issues:opened|issues:reopened|issues:transferred)
              status='Backlog'
              ;;
            issues:closed)
              if [[ "${{ github.event.issue.state_reason }}" != 'completed' ]]; then
                echo 'Issue was not closed as completed; no project mutation performed.'
                printf 'skip=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              status='Done'
              ;;
            pull_request:converted_to_draft)
              status='In Progress'
              ;;
            pull_request:opened|pull_request:reopened|pull_request:synchronize)
              if [[ "${{ github.event.pull_request.draft }}" == 'true' ]]; then
                status='In Progress'
              else
                status='Review / Validation'
              fi
              ;;
            pull_request:ready_for_review)
              status='Review / Validation'
              ;;
            *)
              echo 'Unsupported event/action; no project mutation performed.'
              exit 1
              ;;
          esac
          printf 'name=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'skip=false\n' >> "$GITHUB_OUTPUT"

      - name: Add item and set Project 4 status
        if: steps.status.outputs.skip != 'true'
        shell: bash
        env:
          TARGET_STATUS: ${{ steps.status.outputs.name }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_STATUS" == 'Done' ]]; then
            closing_prs="$({
              GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
                -f query='query($id:ID!){node(id:$id){... on Issue{closedByPullRequestsReferences(first:20,includeClosedPrs:true){nodes{number merged headRefOid repository{nameWithOwner}}}}}}' \
                -F id="$CONTENT_ID"
            })"

            pr_count="$(jq -r '.data.node.closedByPullRequestsReferences.nodes | length' <<<"$closing_prs")"
            if (( pr_count > 0 )); then
              while IFS= read -r encoded; do
                pr="$(printf '%s' "$encoded" | base64 --decode)"
                number="$(jq -r '.number' <<<"$pr")"
                merged="$(jq -r '.merged' <<<"$pr")"
                head_sha="$(jq -r '.headRefOid' <<<"$pr")"
                repo="$(jq -r '.repository.nameWithOwner' <<<"$pr")"

                if [[ "$merged" != 'true' || -z "$head_sha" || "$head_sha" == 'null' ]]; then
                  echo "Issue completion is not eligible for Done: closing PR #$number is not merged or has no head SHA."
                  exit 0
                fi

                runs="$({
                  GH_TOKEN="$REPO_TOKEN" gh api -X GET \
                    "repos/$repo/actions/workflows/ci.yml/runs" \
                    -f head_sha="$head_sha" \
                    -f event='pull_request' \
                    -f per_page=20
                })"
                latest_status="$(jq -r '.workflow_runs[0].status // empty' <<<"$runs")"
                latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$runs")"

                if [[ "$latest_status" != 'completed' || "$latest_conclusion" != 'success' ]]; then
                  echo "Issue completion is not eligible for Done: latest CI for closing PR #$number at $head_sha is status=$latest_status conclusion=$latest_conclusion."
                  exit 0
                fi
              done < <(jq -r '.data.node.closedByPullRequestsReferences.nodes[] | @base64' <<<"$closing_prs")
            fi
          fi

          metadata="$({
            GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
              -f query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id fields(first:100){nodes{... on ProjectV2SingleSelectField{id name options{id name}}}}}}}' \
              -F login="$PROJECT_OWNER" \
              -F number="$PROJECT_NUMBER"
          })"

          project_id="$(jq -r '.data.user.projectV2.id // empty' <<<"$metadata")"
          status_field_id="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .id' <<<"$metadata")"
          status_option_id="$(jq -r --arg target "$TARGET_STATUS" '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == $target) | .id' <<<"$metadata")"

          if [[ -z "$project_id" || -z "$status_field_id" || -z "$status_option_id" ]]; then
            echo "Project 4 metadata missing for Status=$TARGET_STATUS" >&2
            exit 1
          fi

          added="$({
            GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
              -f query='mutation($project:ID!,$content:ID!){addProjectV2ItemById(input:{projectId:$project,contentId:$content}){item{id}}}' \
              -F project="$project_id" \
              -F content="$CONTENT_ID"
          })"
          item_id="$(jq -r '.data.addProjectV2ItemById.item.id // empty' <<<"$added")"

          if [[ -z "$item_id" ]]; then
            echo 'Project item id was not returned after add.' >&2
            exit 1
          fi

          GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
            -f query='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}' \
            -F project="$project_id" \
            -F item="$item_id" \
            -F field="$status_field_id" \
            -F option="$status_option_id"
