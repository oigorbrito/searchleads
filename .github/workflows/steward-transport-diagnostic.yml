name: Steward Transport Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/steward-transport-diagnostic.yml'
permissions:
  contents: read
  checks: read
jobs:
  read-annotation:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read original exact-head Codacy annotation
        run: |
          set -euo pipefail
          gh api repos/oigorbrito/searchleads/commits/ef4be785ba64340a12be38290330fc795818a395/check-runs --jq '.check_runs[] | select(.id == 112496371104 and .name == "Codacy Static Code Analysis") | {id,head_sha,conclusion,output}'
          gh api repos/oigorbrito/searchleads/check-runs/112496371104/annotations --jq '.[] | {path,start_line,end_line,annotation_level,message,title}'
