name: Live network certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest
      - name: Run deterministic contract test
        run: python -m pytest tests/test_live_network_smoke.py -q
      - name: Run bounded live certification
        run: python scripts/run_live_network_certification.py
