name: Chassis Bake-Off

on:
  push:
    branches:
      - 'work/chassis-bakeoff-v1'
      - 'work/empirical-harness-reporting-v1'
  pull_request:
    paths:
      - 'tests/experimental/**'
      - 'tests/fixtures/**'
      - 'tests/test_chassis_bakeoff_report.py'
      - 'tests/test_empirical_observation.py'
      - 'src/searchleads/entity_resolution/**'
      - 'src/searchleads/gap_automation/**'
      - 'src/searchleads/normalization.py'
      - 'scripts/chassis_bakeoff_*.py'
      - 'scripts/empirical_observation.py'
      - 'docs/EMPIRICAL-HARNESS-METHODOLOGY.md'
      - 'docs/EMPIRICAL_CLAIM_CONTRACT_V1.json'
      - 'docs/EMPIRICAL_OBSERVATION_CONTRACT_V1.json'
      - 'docs/REPRODUCIBILITY.md'
      - '.github/workflows/chassis-bakeoff.yml'

permissions:
  contents: read

jobs:
  core-chassis-bakeoff:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'work/chassis-bakeoff-v1' ||
      github.head_ref == 'work/empirical-harness-reporting-v1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout SearchLeads
        uses: actions/checkout@v4

      - name: Checkout pinned external canonical linkage dataset
        id: external-dataset
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: dedupeio/dedupe
          ref: 3f61e79102910bd355e920a2df7e44c14c9cb247
          path: .external/dedupe
          sparse-checkout: |
            benchmarks/benchmarks/datasets/restaurant-1.csv
            benchmarks/benchmarks/datasets/restaurant-2.csv
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bake-off dependencies
        id: install
        continue-on-error: true
        run: >-
          python -m pip install --upgrade pip pytest
          followthemoney==4.10.2 nomenklatura==4.14.0
          crawlee==1.9.3 rigour==2.3.1 python-stdnum==2.2

      - name: Record environment manifest
        id: manifest
        if: always()
        continue-on-error: true
        run: >-
          python scripts/chassis_bakeoff_manifest.py
          --output .artifacts/core-${{ matrix.python-version }}/manifest.json

      - name: Compile SearchLeads
        id: compile
        if: always()
        continue-on-error: true
        run: python -m compileall -q src scripts

      - name: Run SearchLeads regression suite
        id: regression
        if: always()
        continue-on-error: true
        run: >-
          python -m pytest -q tests
          --ignore=tests/experimental
          -W error::ResourceWarning
          --junitxml=.artifacts/core-${{ matrix.python-version }}/regression-junit.xml

      - name: Run all core chassis probes and comparative scorecards
        id: experimental
        if: always()
        continue-on-error: true
        env:
          SEARCHLEADS_EMPIRICAL_OBSERVATION_DIR: .artifacts/core-${{ matrix.python-version }}/observations
        run: >-
          python -m pytest -q -s tests/experimental
          -W error::ResourceWarning
          --junitxml=.artifacts/core-${{ matrix.python-version }}/experimental-junit.xml

      - name: Build canonical evidence report
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          artifact_dir=".artifacts/core-${{ matrix.python-version }}"
          junit_args=()
          for path in "$artifact_dir/regression-junit.xml" "$artifact_dir/experimental-junit.xml"; do
            if [[ -f "$path" ]]; then
              junit_args+=("$path")
            fi
          done
          observation_args=()
          if [[ -d "$artifact_dir/observations" ]]; then
            observation_args=(--observation-dir "$artifact_dir/observations")
          fi
          python scripts/chassis_bakeoff_report.py \
            --study-id core-chassis-bakeoff-py${{ matrix.python-version }} \
            --manifest "$artifact_dir/manifest.json" \
            --junit "${junit_args[@]}" \
            "${observation_args[@]}" \
            --output "$artifact_dir/study-report.json"

      - name: Upload raw empirical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chassis-bakeoff-core-py${{ matrix.python-version }}
          path: .artifacts/core-${{ matrix.python-version }}/
          if-no-files-found: warn

      - name: Enforce core workflow outcome
        if: always()
        shell: bash
        run: |
          failed=0
          check_step() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" != "success" ]]; then
              echo "blocker step=$name outcome=$outcome"
              failed=1
            fi
          }
          check_step external-dataset "${{ steps.external-dataset.outcome }}"
          check_step install "${{ steps.install.outcome }}"
          check_step manifest "${{ steps.manifest.outcome }}"
          check_step compile "${{ steps.compile.outcome }}"
          check_step regression "${{ steps.regression.outcome }}"
          check_step experimental "${{ steps.experimental.outcome }}"
          check_step report "${{ steps.report.outcome }}"
          exit "$failed"

  yente-stable-application:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'work/chassis-bakeoff-v1' ||
      github.head_ref == 'work/empirical-harness-reporting-v1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout SearchLeads experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install isolated Yente stable chassis
        id: install
        continue-on-error: true
        run: >-
          python -m pip install --upgrade pip pytest yente==5.5.0

      - name: Record environment manifest
        id: manifest
        if: always()
        continue-on-error: true
        run: >-
          python scripts/chassis_bakeoff_manifest.py
          --output .artifacts/yente-${{ matrix.python-version }}/manifest.json

      - name: Run Yente application chassis probe only
        id: experimental
        if: always()
        continue-on-error: true
        run: >-
          python -m pytest -q -s
          tests/experimental/test_chassis_bakeoff_yente_application.py
          -W error::ResourceWarning
          --junitxml=.artifacts/yente-${{ matrix.python-version }}/experimental-junit.xml

      - name: Build canonical evidence report
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          artifact_dir=".artifacts/yente-${{ matrix.python-version }}"
          junit_args=()
          if [[ -f "$artifact_dir/experimental-junit.xml" ]]; then
            junit_args+=("$artifact_dir/experimental-junit.xml")
          fi
          python scripts/chassis_bakeoff_report.py \
            --study-id yente-application-py${{ matrix.python-version }} \
            --manifest "$artifact_dir/manifest.json" \
            --junit "${junit_args[@]}" \
            --output "$artifact_dir/study-report.json"

      - name: Upload raw empirical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chassis-bakeoff-yente-py${{ matrix.python-version }}
          path: .artifacts/yente-${{ matrix.python-version }}/
          if-no-files-found: warn

      - name: Enforce Yente workflow outcome
        if: always()
        shell: bash
        run: |
          failed=0
          check_step() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" != "success" ]]; then
              echo "blocker step=$name outcome=$outcome"
              failed=1
            fi
          }
          check_step install "${{ steps.install.outcome }}"
          check_step manifest "${{ steps.manifest.outcome }}"
          check_step experimental "${{ steps.experimental.outcome }}"
          check_step report "${{ steps.report.outcome }}"
          exit "$failed"
